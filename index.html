<script>
  const ITENS = [
    "GR0883 - CARRINHO SEM GAVETA fora de linha.",
    "GA811 - PEGADOR PINÇA no aguardo do contêiner.",
    "GR0853 - PEGADOR DISSOLE fora de linha.",
    "GA501 - FACA 6\" sem estoque, e sem previsão de chegada.",
    "GA503 - FACA 8\" no aguardo do contêiner.",
    "TC3920 - Sem estoque, previsão dia 15/02.",
    "GR0864 - No aguardo do contêiner."
  ];

  const elList = document.getElementById("list");
  const elCount = document.getElementById("count");
  const elQ = document.getElementById("q");

  function normalize(s){
    return (s || "")
      .toString()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
  }

  function render(items){
    elList.innerHTML = "";
    items.forEach(texto => {
      const row = document.createElement("div");
      row.className = "item";
      row.textContent = texto;
      elList.appendChild(row);
    });
    elCount.textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
  }

  function applyFilter(){
    const q = normalize(elQ.value);
    if(!q){ render(ITENS); return; }
    render(ITENS.filter(t => normalize(t).includes(q)));
  }

  elQ.addEventListener("input", applyFilter);
  render(ITENS);
</script>
