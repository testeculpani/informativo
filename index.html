<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Informativo Grilazer</title>
  <style>
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(2, 6, 23, .06);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1100px 500px at 15% -10%, rgba(56,189,248,.25), transparent 60%),
        radial-gradient(900px 450px at 85% 0%, rgba(99,102,241,.18), transparent 55%),
        var(--bg);
      color: var(--text);
    }

    .wrap{ max-width: 980px; margin: 0 auto; padding: 18px 16px; }

    header{
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246,247,251,.82);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(229,231,235,.9);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 14px 16px;
      max-width: 980px;
      margin: 0 auto;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap: 2px;
    }

    h1{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
    }

    .meta{
      font-size: 12px;
      color: var(--muted);
    }

    .badge{
      display:flex;
      align-items:center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255,255,255,.85);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(2, 6, 23, .04);
      white-space: nowrap;
    }

    main .panel{
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(229,231,235,.9);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head{
      padding: 14px 16px;
      border-bottom: 1px solid rgba(229,231,235,.9);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      background: linear-gradient(to right, rgba(255,255,255,.95), rgba(255,255,255,.7));
    }

    .panel-title{
      display:flex;
      flex-direction:column;
      gap: 2px;
    }
    .panel-title strong{
      font-size: 14px;
    }
    .panel-title span{
      font-size: 12px;
      color: var(--muted);
      display:none; /* removido */
    }

    .list{
      padding: 8px;
      display: grid;
      gap: 10px;
    }

    .item{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display:flex;
      gap: 10px;
      align-items:flex-start;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .item:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(2, 6, 23, .06);
    }

    .dot{
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border-radius: 999px;
      background: #38bdf8;
      flex: 0 0 10px;
      box-shadow: 0 0 0 4px rgba(56,189,248,.18);
    }

    .text{
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .empty{
      padding: 18px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    footer{
      max-width: 980px;
      margin: 12px auto 0;
      padding: 0 16px 24px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>Informativo Grilazer</h1>
        <div class="meta" id="updated"></div>
      </div>
      <div class="badge" id="count">0 itens</div>
    </div>
  </header>

  <div class="wrap">
    <main class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <strong>Mural de avisos</strong>
        </div>
      </div>

      <div class="list" id="list"></div>
      <div class="empty" id="empty" style="display:none;">Sem informações no momento.</div>
    </main>
  </div>

  <script>
    /********************************************************
     * ✏️ EDITAR AQUI
     * Atualizado (texto livre) + linhas do mural
     ********************************************************/
    const ATUALIZADO = "02/02/2026 08:00"; // <-- você edita aqui
    const ITENS = [
      "GR0883 - CARRINHO SEM GAVETA fora de linha.",
      "GR0853 - PEGADOR DISSOLE fora de linha.",
      "GR0825 - Soprador com estoque baixo! Aguardando prazo do proximo conteiner!",
      "Novos Carrinhos entrando GR0884; GR0885. Liberação de estoque apartir do dia 26/02.",
      "GA501 - FACA 6\" sem estoque, e sem previsão de chegada.",
      "TC51 e TC52 - Com estoque baixo, atenção no volume de peças vendida!",
    ];

    const elList = document.getElementById("list");
    const elCount = document.getElementById("count");
    const elUpdated = document.getElementById("updated");
    const elEmpty = document.getElementById("empty");

    function render(items){
      elList.innerHTML = "";

      const total = (items && items.length) ? items.length : 0;
      elCount.textContent = `${total} itens`;

      if(total === 0){
        elEmpty.style.display = "block";
        return;
      }
      elEmpty.style.display = "none";

      items.forEach(texto => {
        const row = document.createElement("div");
        row.className = "item";

        const dot = document.createElement("div");
        dot.className = "dot";

        const txt = document.createElement("div");
        txt.className = "text";
        txt.textContent = texto;

        row.appendChild(dot);
        row.appendChild(txt);
        elList.appendChild(row);
      });
    }

    // Atualizado: sempre do campo ATUALIZADO (sem automático)
    elUpdated.textContent = `Atualizado: ${ATUALIZADO || "-"}`;

    render(ITENS);
  </script>
</body>
</html>
